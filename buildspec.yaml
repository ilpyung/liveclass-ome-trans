version: 0.2
phases:
    install:
        runtime-versions:
            nodejs: 22
        commands:
            # - aws sts get-caller-identity
    pre_build:
        commands:
            # ECR Login
            - echo Start pre build
            - export IMAGE_MAGER_V=2
            - export IMAGE_MINOR_V=0
            - export IMAGE_TAG=$IMAGE_MAGER_V.$IMAGE_MINOR_V.$CODEBUILD_BUILD_NUMBER
            - aws ecr get-login-password --region ap-northeast-2 | docker login --username AWS --password-stdin "$(aws sts get-caller-identity --query Account --output text).dkr.ecr.ap-northeast-2.amazonaws.com"
    build:
        commands:
            - export IMAGE_FULL_NAME=$IMAGE_REPO_URI/$IMAGE_REPO_NAME:$IMAGE_TAG
            - docker build -t $IMAGE_REPO_URI/$IMAGE_REPO_NAME:latest .
            - docker tag $IMAGE_REPO_URI/$IMAGE_REPO_NAME:latest $IMAGE_FULL_NAME
            - docker push $IMAGE_REPO_URI/$IMAGE_REPO_NAME:latest
            - docker push $IMAGE_FULL_NAME

    post_build:
        commands:
            - echo Complete build process
